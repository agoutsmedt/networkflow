url: https://agoutsmedt.github.io/networkflow/
template:
  bootstrap: 5
  math-rendering: katex       # formulas of the function documentation (\deqn, \eqn)
  light-switch: true        # light / dark / auto toggle in the navbar
  bslib:
    # Accent of the package: the blue end of scico "roma". The same
    # structure is used in the sibling packages, each with its own accent
    # (see pkgdown/extra.scss).
    primary: "#2169B0"
    secondary: "#7E1700"
    bg: "#F4F1E8"
    fg: "#14284B"
    navbar-bg: "#14284B"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Serif 4"}
    code_font: {google: "JetBrains Mono"}

home:
  title: "networkflow: a research pipeline for projected and dynamic networks"

# The footer names the two maintainers (the sidebar lists all the authors)
footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: >
      Developed by [Aurélien Goutsmedt](https://aurelien-goutsmedt.com)
      and [Thomas Delcey](https://orcid.org/0000-0003-0546-1474).

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]

articles:
- title: Guides
  navbar: ~
  contents:
  - '`articles/from-references-to-networks`'
  - '`articles/finding-and-reading-clusters`'
  - '`articles/drawing-networks`'
  - '`articles/following-clusters-over-time`'
  - '`articles/beyond-bibliographic-coupling`'

reference:
- title: "Step 1: Building networks"
  desc: >
    Project a table of links between two kinds of entities (articles and
    references, authors and papers...) onto a network, for the whole corpus
    or one network per time window, and keep its main components.
  contents:
  - build_network
  - build_dynamic_networks
  - filter_components

- title: "Step 2: Finding and reading clusters"
  desc: >
    Detect communities, follow them across time windows, name them and
    characterise the role of their members.
  contents:
  - add_clusters
  - merge_dynamic_clusters
  - merge_diagnostics
  - plot_merge_diagnostics
  - name_clusters
  - extract_tfidf
  - add_node_roles

- title: "Step 3: Drawing networks"
  desc: >
    Compute coordinates, colours and label positions, and plot the networks.
  contents:
  - layout_networks
  - color_networks
  - prepare_label_networks
  - plot_networks

- title: "Step 4: Drawing the history of clusters"
  desc: >
    Turn a list of networks with dynamic clusters into an alluvial plot.
  contents:
  - networks_to_alluv
  - minimize_crossing_alluvial
  - plot_alluvial

- title: "Example data"
  desc: >
    The explanations of the 1970s US stagflation and the references they
    cite, from Goutsmedt (2021), "From the Stagflation to the Great
    Inflation", Revue d'Économie Politique 131(3).
  contents:
  - contains("stagflation")
  - ends_with("coupling")

- title: Package
  contents:
  - networkflow-package
